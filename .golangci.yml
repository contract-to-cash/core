version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - exhaustive
    - forbidigo
    - misspell
    - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      # Snapshot APIs (ToSnapshot / FromSnapshot / CreditNoteFromSnapshot) are
      # reserved for persistence adapters. They deliberately bypass construction-
      # time invariants and must not be used by application or domain-service
      # code. See domain/*/snapshot.go header comments and issue #100.
      #
      # Note: ContractAggregate.MarshalSnapshot / LoadFromSnapshot are a
      # different API (event-sourced aggregate snapshotting coupled to the
      # eventstore package) and are intentionally NOT forbidden here.
      #
      # Pattern note: forbidigo matches against the identifier expression
      # (e.g. `e.ToSnapshot`), not the full call syntax. Patterns are anchored
      # to avoid matching longer identifiers like `ToSnapshotFoo`.
      forbid:
        - pattern: '\.ToSnapshot$'
          msg: "Snapshot APIs are for persistence adapters only. Use NewXxx and state-transition methods for normal domain operations (see domain/*/snapshot.go header and issue #100)."
        - pattern: '^(FromSnapshot|CreditNoteFromSnapshot)$'
          msg: "Snapshot reconstruction APIs are for persistence adapters only (see domain/*/snapshot.go header and issue #100)."
      analyze-types: false
      exclude-godoc-examples: true
    govet:
      enable:
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    rules:
      - linters: [govet]
        text: 'shadow: declaration of "err" shadows declaration at'
      # Snapshot API definition files — these legitimately implement the
      # ToSnapshot / FromSnapshot pattern.
      - path: 'domain/[^/]+/snapshot[^/]*\.go$'
        linters: [forbidigo]
      - path: 'domain/invoice/credit_note_snapshot[^/]*\.go$'
        linters: [forbidigo]
      # Persistence adapters are the intended consumers of Snapshot APIs.
      - path: 'infrastructure/'
        linters: [forbidigo]
      # Integration tests may exercise the snapshot/restore round-trip.
      - path: 'tests/'
        linters: [forbidigo]
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples/

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples/

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
