version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gofmt
    - goimports
    - misspell
    - nolintlint
    - bodyclose
    - exhaustive
    - copyloopvar

settings:
  errcheck:
    check-type-assertions: true
  exhaustive:
    default-signifies-exhaustive: true
  nolintlint:
    require-explanation: true
    require-specific: true
  govet:
    enable:
      - shadow

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
