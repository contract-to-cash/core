desc: "Invoice void: void draft/finalized, reject void of paid"
runners:
  req: "{{ env.BASE_URL }}"
steps:
  - desc: Create and activate contract
    req:
      /contracts:
        post:
          body:
            application/json:
              account_id: "acc-void-001"
              plan_id: "plan-basic"
              contract_type: "subscription"
              billing_cycle: "monthly"
              price: 5000
    test: |
      current.res.status == 201
  - desc: Activate
    req:
      /contracts/{{ steps[0].res.body.id }}/activate:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Generate invoice (draft)
    req:
      /invoices/generate:
        post:
          body:
            application/json:
              contract_id: "{{ steps[0].res.body.id }}"
              period_start: "2026-03-01"
              period_end: "2026-04-01"
    test: |
      current.res.status == 201
      && current.res.body.status == "draft"
  - desc: Void the draft invoice
    req:
      /invoices/{{ steps[2].res.body.id }}/void:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "voided"
  - desc: Generate a second invoice (for finalize test)
    req:
      /invoices/generate:
        post:
          body:
            application/json:
              contract_id: "{{ steps[0].res.body.id }}"
              period_start: "2026-03-01"
              period_end: "2026-04-01"
    test: |
      current.res.status == 201
  - desc: Finalize the second invoice
    req:
      /invoices/{{ steps[4].res.body.id }}/finalize:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "finalized"
  - desc: Void the finalized invoice
    req:
      /invoices/{{ steps[4].res.body.id }}/void:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "voided"
  - desc: Generate a third invoice (for paid void test)
    req:
      /invoices/generate:
        post:
          body:
            application/json:
              contract_id: "{{ steps[0].res.body.id }}"
              period_start: "2026-03-01"
              period_end: "2026-04-01"
    test: |
      current.res.status == 201
  - desc: Finalize the third invoice
    req:
      /invoices/{{ steps[7].res.body.id }}/finalize:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Pay the third invoice
    req:
      /invoices/{{ steps[7].res.body.id }}/pay:
        post:
          body:
            application/json:
              amount: 5000
              payment_method_id: "pm-001"
    test: |
      current.res.status == 201
  - desc: Attempt to void a paid invoice (should fail)
    req:
      /invoices/{{ steps[7].res.body.id }}/void:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 422
