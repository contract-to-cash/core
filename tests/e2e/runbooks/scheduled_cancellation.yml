desc: "Scheduled cancellation: schedule cancel at period end, then renew triggers cancellation"
runners:
  req: "{{ env.BASE_URL }}"
steps:
  - desc: Create subscription contract
    req:
      /contracts:
        post:
          body:
            application/json:
              account_id: "acc-sched-001"
              product_id: "plan-basic"
              contract_type: "subscription"
              billing_cycle: "monthly"
              price: 3000
    test: |
      current.res.status == 201
  - desc: Activate
    req:
      /contracts/{{ steps[0].res.body.id }}/activate:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "active"
  - desc: Schedule cancellation at period end
    req:
      /contracts/{{ steps[0].res.body.id }}/schedule-cancellation:
        post:
          body:
            application/json:
              reason: "customer requested downgrade"
    test: |
      current.res.status == 200
      && current.res.body.status == "active"
      && current.res.body.cancel_at_period_end == true
  - desc: Advance clock past period end
    req:
      /clock/advance:
        post:
          body:
            application/json:
              days: 31
    test: |
      current.res.status == 200
  - desc: Renew triggers cancellation
    req:
      /contracts/{{ steps[0].res.body.id }}/renew:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "cancelled"
