desc: "Cancel terminates server: full lifecycle from provisioning to cleanup"
runners:
  req: "{{ env.BASE_URL }}"
steps:
  - desc: Register provisioning plugin
    req:
      /plugins/provisioning/register:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Create contract
    req:
      /contracts:
        post:
          body:
            application/json:
              account_id: "acc-term-001"
              product_id: "prod-vps"
              contract_type: "subscription"
              billing_cycle: "monthly"
              price: 5000
    test: |
      current.res.status == 201
  - desc: Activate
    req:
      /contracts/{{ steps[1].res.body.id }}/activate:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Generate, finalize, pay
    req:
      /invoices/generate:
        post:
          body:
            application/json:
              contract_id: "{{ steps[1].res.body.id }}"
              period_start: "2026-03-01"
              period_end: "2026-04-01"
    test: |
      current.res.status == 201
  - desc: Finalize
    req:
      /invoices/{{ steps[3].res.body.id }}/finalize:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Pay
    req:
      /invoices/{{ steps[3].res.body.id }}/pay:
        post:
          body:
            application/json:
              amount: 5000
              payment_method_id: "pm-001"
    test: |
      current.res.status == 201
  - desc: Server running
    req:
      /servers/{{ steps[1].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.state == "running"
  - desc: Cancel contract -> server terminated
    req:
      /contracts/{{ steps[1].res.body.id }}/cancel:
        post:
          body:
            application/json:
              reason: "switching provider"
    test: |
      current.res.status == 200
      && current.res.body.status == "cancelled"
  - desc: Server should be "terminated"
    req:
      /servers/{{ steps[1].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.state == "terminated"
