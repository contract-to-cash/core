desc: "Smoke test: recommended payment-gated provisioning flow"
runners:
  req: "{{ env.BASE_URL }}"
steps:
  - desc: Health check
    req:
      /health:
        get:
          body: null
    test: |
      current.res.status == 200
  - desc: Create contract (Draft)
    req:
      /contracts:
        post:
          body:
            application/json:
              account_id: "acc-smoke"
              product_id: "plan-smoke"
              contract_type: "subscription"
              billing_cycle: "monthly"
              price: 1000
    test: |
      current.res.status == 201
      && current.res.body.status == "draft"
  - desc: Generate draft invoice on Draft contract
    req:
      /invoices/generate:
        post:
          body:
            application/json:
              contract_id: "{{ steps[1].res.body.id }}"
              period_start: "2026-03-01"
              period_end: "2026-04-01"
    test: |
      current.res.status == 201
      && current.res.body.subtotal == 1000
      && current.res.body.total == 1000
  - desc: Activate contract (user confirmed)
    req:
      /contracts/{{ steps[1].res.body.id }}/activate:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "active"
  - desc: Finalize invoice
    req:
      /invoices/{{ steps[2].res.body.id }}/finalize:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Suspend contract (awaiting payment)
    req:
      /contracts/{{ steps[1].res.body.id }}/suspend:
        post:
          body:
            application/json:
              reason: "awaiting_initial_payment"
              billing_behavior: "skip"
    test: |
      current.res.status == 200
      && current.res.body.status == "suspended"
  - desc: Pay invoice
    req:
      /invoices/{{ steps[2].res.body.id }}/pay:
        post:
          body:
            application/json:
              amount: 1000
              payment_method_id: "pm-001"
    test: |
      current.res.status == 201
      && current.res.body.status == "completed"
  - desc: Resume contract (payment confirmed, service starts)
    req:
      /contracts/{{ steps[1].res.body.id }}/resume:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "active"
  - desc: GET contract returns active state
    req:
      /contracts/{{ steps[1].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.id == steps[1].res.body.id
      && current.res.body.status == "active"
  - desc: GET invoice returns paid state
    req:
      /invoices/{{ steps[2].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.id == steps[2].res.body.id
  - desc: Cannot suspend draft contract (create a new one)
    req:
      /contracts:
        post:
          body:
            application/json:
              account_id: "acc-smoke-2"
              product_id: "plan-smoke"
              contract_type: "subscription"
              billing_cycle: "monthly"
              price: 1000
    test: |
      current.res.status == 201
  - desc: Suspend draft should fail
    req:
      /contracts/{{ steps[10].res.body.id }}/suspend:
        post:
          body:
            application/json:
              reason: "test"
    test: |
      current.res.status == 422
