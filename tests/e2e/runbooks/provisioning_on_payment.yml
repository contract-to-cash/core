desc: "Provisioning: payment-gated flow — server provisioned only after payment clears"
runners:
  req: "{{ env.BASE_URL }}"
steps:
  - desc: Register provisioning plugin
    req:
      /plugins/provisioning/register:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Create contract (Draft)
    req:
      /contracts:
        post:
          body:
            application/json:
              account_id: "acc-prov-001"
              product_id: "prod-vps"
              contract_type: "subscription"
              billing_cycle: "monthly"
              price: 5000
    test: |
      current.res.status == 201
      && current.res.body.status == "draft"
  - desc: Server should be "none" before payment
    req:
      /servers/{{ steps[1].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.state == "none"
  - desc: Generate draft invoice on Draft contract
    req:
      /invoices/generate:
        post:
          body:
            application/json:
              contract_id: "{{ steps[1].res.body.id }}"
              period_start: "2026-03-01"
              period_end: "2026-04-01"
    test: |
      current.res.status == 201
  - desc: Activate contract (user confirmed)
    req:
      /contracts/{{ steps[1].res.body.id }}/activate:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "active"
  - desc: Finalize invoice
    req:
      /invoices/{{ steps[3].res.body.id }}/finalize:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Suspend contract (awaiting initial payment)
    req:
      /contracts/{{ steps[1].res.body.id }}/suspend:
        post:
          body:
            application/json:
              reason: "awaiting_initial_payment"
              billing_behavior: "skip"
    test: |
      current.res.status == 200
      && current.res.body.status == "suspended"
  - desc: Server should be "stopped" while suspended (OnContractSuspendHook fires)
    req:
      /servers/{{ steps[1].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.state == "stopped"
  - desc: Pay invoice (triggers AfterCharge hook)
    req:
      /invoices/{{ steps[3].res.body.id }}/pay:
        post:
          body:
            application/json:
              amount: 5000
              payment_method_id: "pm-001"
    test: |
      current.res.status == 201
      && current.res.body.status == "completed"
  - desc: Resume contract (payment confirmed)
    req:
      /contracts/{{ steps[1].res.body.id }}/resume:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "active"
  - desc: Server should now be "running" (provisioned on Resume)
    req:
      /servers/{{ steps[1].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.state == "running"
