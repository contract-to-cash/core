desc: "Payment failure: gateway fails, failed payment record created"
runners:
  req: "{{ env.BASE_URL }}"
steps:
  - desc: Create and activate contract
    req:
      /contracts:
        post:
          body:
            application/json:
              account_id: "acc-fail-001"
              plan_id: "plan-basic"
              contract_type: "subscription"
              billing_cycle: "monthly"
              price: 5000
    test: |
      current.res.status == 201
  - desc: Activate
    req:
      /contracts/{{ steps[0].res.body.id }}/activate:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Generate invoice
    req:
      /invoices/generate:
        post:
          body:
            application/json:
              contract_id: "{{ steps[0].res.body.id }}"
              period_start: "2026-03-01"
              period_end: "2026-04-01"
    test: |
      current.res.status == 201
  - desc: Finalize invoice
    req:
      /invoices/{{ steps[2].res.body.id }}/finalize:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
      && current.res.body.status == "finalized"
  - desc: Set gateway to fail
    req:
      /gateway/fail:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Attempt payment (should fail)
    req:
      /invoices/{{ steps[2].res.body.id }}/pay:
        post:
          body:
            application/json:
              amount: 5000
              payment_method_id: "pm-001"
    test: |
      current.res.status == 422
  - desc: Invoice should still be finalized (not paid)
    req:
      /invoices/{{ steps[2].res.body.id }}:
        get:
          body: null
    test: |
      current.res.status == 200
      && current.res.body.status == "finalized"
      && current.res.body.paid_amount == 0
  - desc: Reset gateway to succeed
    req:
      /gateway/succeed:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200
  - desc: Retry payment (should succeed)
    req:
      /invoices/{{ steps[2].res.body.id }}/pay:
        post:
          body:
            application/json:
              amount: 5000
              payment_method_id: "pm-001"
    test: |
      current.res.status == 201
      && current.res.body.status == "completed"
